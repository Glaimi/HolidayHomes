<section>
  <div class="accommodation-card">
    <div class="card-header">
      <h3 class="property-title">{{accomodation.name}}</h3>

      <div class="property-address">
        <span>{{accomodation.street}}, <fa-icon [icon]="faLocationDot"></fa-icon> {{accomodation.city}}</span>
      </div>
      <div class="favorite-icon" (click)="toggleFavorite($event)">
        <fa-icon [icon]="isFavorite ? faSolidHeart : faRegularHeart"></fa-icon>
      </div>
    </div>

    <div class="card-image">
      <img [src]="accomodation.image" [alt]="'Exterior of ' + accomodation.name" class="property-image">
    </div>

    <div class="card-content">
      <div class="property-features">
        <div class="feature">
          <fa-icon [icon]="faBed"></fa-icon>
          <span>{{accomodation.numberOfBeds}} Betten</span>
        </div>
        <div class="feature">
          <fa-icon [icon]="faExpand"></fa-icon>
          <span>{{accomodation.squareMeter}} m²</span>
        </div>
      </div>

      <div class="property-footer">
        <div class="property-type">
          <fa-icon [icon]="faHome"></fa-icon>
          <span>{{accomodation.type}}</span>
        </div>
      </div>
    </div>
  </div>
</section>
