<div class="accomodation-list-container">
  <!-- Filter Controls -->
  <div class="filter-controls">
    <div class="filter-section">
      <h3>Filter</h3>
      
      <!-- Size Filter -->
      <div class="filter-group">
        <label>Wohnfläche:</label>
        <div class="filter-options">
          <button 
            *ngFor="let size of sizeOptions"
            [class.active]="filterOptions.minSize === size.value"
            (click)="filterOptions.minSize = (filterOptions.minSize === size.value ? null : size.value); onFilterChange()">
            {{ size.label }}
          </button>
        </div>
      </div>
      
      <!-- Rooms Filter -->
      <div class="filter-group">
        <label>Zimmer:</label>
        <div class="filter-options">
          <button 
            *ngFor="let room of roomOptions"
            [class.active]="filterOptions.minRooms === room.value"
            (click)="filterOptions.minRooms = (filterOptions.minRooms === room.value ? null : room.value); onFilterChange()">
            {{ room.label }}
          </button>
        </div>
      </div>
      
      <!-- Amenities Filter -->
      <div class="filter-group">
        <label>Ausstattung:</label>
        <div class="filter-options">
          <label class="checkbox-option">
            <input 
              type="checkbox" 
              [(ngModel)]="filterOptions.dogsAllowed" 
              (change)="onFilterChange()">
            <span>Hunde erlaubt</span>
          </label>
          
          <label class="checkbox-option">
            <input 
              type="checkbox" 
              [(ngModel)]="filterOptions.hasWifi" 
              (change)="onFilterChange()">
            <span>WLAN</span>
          </label>
          
          <label class="checkbox-option">
            <input 
              type="checkbox" 
              [(ngModel)]="filterOptions.hasSauna" 
              (change)="onFilterChange()">
            <span>Sauna</span>
          </label>
        </div>
      </div>
      
      <button class="reset-filters" (click)="resetFilters()">
        Filter zurücksetzen
      </button>
    </div>
    
    <!-- Sorting Controls -->
    <div class="sorting-controls">
      <label for="sort-select">Sortieren nach:</label>
      <select 
        id="sort-select"
        [(ngModel)]="selectedSort"
        (change)="onSortChange()"
        class="sort-select"
      >
        <option *ngFor="let option of sortOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>
  </div>

  <!-- Accommodation Grid -->
  <div class="accomodation-grid">
    @for (accomodation of filteredAccommodations; track accomodation) {
      <app-accomodation [accomodation]="accomodation"></app-accomodation>
    } @empty {
      <p class="no-results">
        Keine Unterkünfte gefunden, die den ausgewählten Filtern entsprechen.
      </p>
    }
  </div>
</div>
