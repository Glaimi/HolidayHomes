<div class="calendar-container">
  <mat-calendar
    [dateClass]="dateClassCombined"
    [dateFilter]="dateFilter"
    (selectedChange)="onDateSelected($event)"
  ></mat-calendar>
  @if (selectionError) {
    <div class="calendar-error">{{ selectionError }}</div>
  }
</div>

<div class="date-selection-info">
  <p>Startdatum: {{ startDateSelected | date }}</p>
  <p>Enddatum: {{ endDateSelected | date }}</p>
  <button (click)="resetSelection()">Auswahl zurücksetzen</button>
</div>
